manifestVersion: 1
id: jhipsman-cue
category: media
name: Cue
version: "2.1.0"
tagline: Movies and TV, from search to library, in one app
icon: https://raw.githubusercontent.com/jhipsman/cueapp/main/branding/cue-icon-512.png
description: >-
  Cue is an all-in-one media manager for movies and TV. Discover a title and it searches your Usenet and torrent indexers, downloads the best release with its built-in downloaders, unpacks it, names it the way you chose and puts it in your library, ready for Jellyfin or Plex.


  It does the jobs of Radarr, Sonarr, Prowlarr, SABnzbd, a torrent client and Bazarr in one app, with quality profiles, automatic upgrades, subtitles, notifications, family accounts and a built-in VPN for torrents.


  Your library lives in your Umbrel's Downloads folder (movies and tv), so media servers such as Jellyfin and Plex on your Umbrel can see it. Cue has its own login: create your account in the setup wizard the first time you open it.


  Cue does not provide or host any content. You are responsible for the indexers you add and what you download.
