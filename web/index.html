<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cue</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101114" />
    <!-- Added to an iPhone's home screen, Cue opens full screen like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Cue" />
    <!-- The loading screen, as the TV app opens: the Cue mark grows and turns
         into place with a soft glow breathing behind it, and "cue" slides in
         beside it. Shown before the app's code arrives; components/Splash.tsx
         draws the same markup and carries the animation on from where this one
         is, so it only plays once. -->
    <style>
      @font-face { font-family: 'Sora'; src: url('/fonts/Sora-Variable.ttf') format('truetype'); font-weight: 100 800; font-display: swap; }
      .splash { --settle: cubic-bezier(0.2, 0.8, 0.2, 1); --splash-t: 0ms; position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 28px; padding: 24px; background: #101114; color: #f4f4f5; font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .splash-lockup { position: relative; display: flex; align-items: center; gap: clamp(12px, 1.6vw, 18px); }
      .splash-glow { position: absolute; left: 50%; top: 50%; width: clamp(240px, 32vw, 360px); aspect-ratio: 1; margin: calc(clamp(240px, 32vw, 360px) / -2) 0 0 calc(clamp(240px, 32vw, 360px) / -2); pointer-events: none; animation: splash-in 700ms var(--settle) var(--splash-t) both; }
      .splash-glow::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--splash-accent, #34d1bf) 32%, transparent), transparent); animation: splash-breathe 1400ms cubic-bezier(0.4, 0, 0.2, 1) var(--splash-t) infinite alternate; }
      .splash-logo { position: relative; width: clamp(56px, 6vw, 84px); height: clamp(56px, 6vw, 84px); color: var(--splash-accent, #34d1bf); animation: splash-mark 700ms var(--settle) var(--splash-t) both; }
      .splash-word { position: relative; font: 700 clamp(44px, 4.6vw, 64px)/1 'Sora', system-ui, sans-serif; letter-spacing: -0.03em; animation: splash-word 600ms var(--settle) calc(var(--splash-t) + 220ms) both; }
      .splash-label { color: #a6a8ae; font-size: 0.95rem; text-align: center; }
      .splash-label.quiet { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @keyframes splash-in { from { opacity: 0; } }
      @keyframes splash-mark { from { opacity: 0; transform: scale(0.7) rotate(-18deg); } }
      @keyframes splash-word { from { opacity: 0; transform: translateX(-24px); } }
      @keyframes splash-breathe { from { opacity: 0.7; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
      :root[data-theme='light'] .splash { --splash-accent: #0b7a6f; background: #f6f7f9; color: #1b2330; }
      :root[data-theme='light'] .splash-label { color: #444b58; }
      @media (prefers-reduced-motion: reduce) { .splash-glow, .splash-glow::before, .splash-logo, .splash-word { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status">
        <div class="splash-lockup">
          <span class="splash-glow" aria-hidden="true"></span>
          <svg class="splash-logo" viewBox="0 0 256 256" aria-hidden="true"><path d="M206.77,198.93 A106,106 0 1 1 206.77,57.07 A21.0,21.0 0 0 1 175.56,85.18 A64,64 0 1 0 175.56,170.82 A21.0,21.0 0 0 1 206.77,198.93 Z M115.76,106.20 Q115.76,95.00 125.60,100.35 L166.64,122.65 Q176.48,128.00 166.64,133.35 L125.60,155.65 Q115.76,161.00 115.76,149.80 Z" fill="currentColor" /></svg>
          <span class="splash-word" aria-hidden="true">cue</span>
        </div>
        <span class="splash-label quiet">Loading Cue</span>
      </div>
      <script>
        window.__cueSplashAt = performance.now()
        // Cue is dark unless light was chosen (main.tsx does the same, later).
        try { if (localStorage.getItem('cue-theme') === 'light') document.documentElement.dataset.theme = 'light' } catch (e) {}
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
