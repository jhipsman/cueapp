# The image a cloud server runs (deploy/cloud): built from every push to main,
# for Intel/AMD and ARM servers, and published as ghcr.io/<owner>/cue:edge.
# Releases (release.yml) publish to the same image name with version tags and
# :latest. Until the first release exists this workflow also moves :latest, so
# servers set up with deploy/cloud/install.sh (which follow :latest) pick up
# main builds in their nightly update; after that :latest is left to releases.
name: Cloud image

on:
  push:
    branches: [main]
    paths-ignore:
      - "android/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: cloud-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The runtime stage runs `apk add` for the target architecture, which
      # needs QEMU for the arm64 image even though Go itself cross-compiles.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cue"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          # :latest belongs to releases once there is one (a v* tag). If the
          # lookup fails, fail the job rather than risk moving :latest.
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name | select(startswith("v"))')"
          if [ -z "${releases}" ]; then
            echo "latest=${image}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:edge
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.latest }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Cue, for a cloud server
          build-args: |
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }}
            TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          cache-from: type=gha,scope=cloud
          cache-to: type=gha,mode=max,scope=cloud
